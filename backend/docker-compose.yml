# TrackRate + MusicBrainz — stack unificado
# Uso: cd backend && docker compose up -d
#
# Requisito: ./scripts/stack-setup.sh (clona musicbrainz-docker/)
# TrackRate API → WS lookup/detalle; búsqueda catálogo → Postgres MB (sin Solr)

name: trackrate-stack

include:
  - path: musicbrainz-docker/docker-compose.yml
    project_directory: musicbrainz-docker
  - path: compose/musicbrainz-standalone.yml
  - path: compose/musicbrainz-minimal.yml
  - path: compose/trackrate.yml
