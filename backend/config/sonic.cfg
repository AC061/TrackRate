# Sonic v1.4.9 — catálogo TrackRate (typos + suggest)
# Montado en /etc/sonic.cfg dentro del contenedor.

[server]
log_level = "info"

[channel]
inet = "0.0.0.0:1491"
tcp_timeout = 7200
auth_password = "TrackRateSonicDev"

[channel.search]
query_limit_default = 25
query_limit_maximum = 100
query_alternates_try = 4

suggest_limit_default = 10
suggest_limit_maximum = 20

list_limit_default = 100
list_limit_maximum = 500

[store]

[store.kv]
path = "/var/lib/sonic/store/kv/"
retain_word_objects = 1000

[store.kv.pool]
inactive_after = 1800

[store.kv.database]
flush_after = 900
compress = true
parallelism = 2
max_files = 100
max_compactions = 1
max_flushes = 1
write_buffer = 16384
write_ahead_log = true

[store.fst]
path = "/var/lib/sonic/store/fst/"

[store.fst.pool]
# consolidate_after debe ser estrictamente menor que inactive_after (validación Sonic)
inactive_after = 1200

[store.fst.graph]
# Sample MB supera defaults (2 MB / 250k palabras)
consolidate_after = 900
max_size = 65536
max_words = 2000000
