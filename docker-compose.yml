# TrackRate + MusicBrainz — stack unificado
# Uso: desde la raíz del repo → docker compose up -d
#
# Requisito: clonar musicbrainz-docker (ver scripts/stack-setup.sh)
# La API TrackRate habla con MusicBrainz por red interna: http://musicbrainz:5000/ws/2

name: trackrate-stack

include:
  - path: musicbrainz-docker/docker-compose.yml
    project_directory: musicbrainz-docker
  - path: compose/trackrate.yml
